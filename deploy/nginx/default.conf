# www → domínio principal (o tunnel entrega o Host original; o TLS termina na Cloudflare)
server {
    listen 80;
    server_name www.shvdigital.com.br;
    return 301 https://shvdigital.com.br$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Atrás do tunnel o scheme/porta vistos pelo nginx não são os públicos: redireciona com caminho relativo
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Os idiomas canônicos são /pt-BR/, /en/ e /es/ (minúsculas, exceto pt-BR)
    rewrite ^/EN(/.*)?$ /en$1 permanent;
    rewrite ^/ES(/.*)?$ /es$1 permanent;
    rewrite ^/(?:pt-br|PT-BR)(/.*)?$ /pt-BR$1 permanent;

    # Cada idioma tem o seu index.html pré-renderizado: sem fallback de SPA.
    # URLs sem barra final (/en) são redirecionadas pelo nginx para /en/.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Assets do Vite têm hash no nome: podem ser cacheados indefinidamente
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|webp|avif|svg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
